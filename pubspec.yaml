name: magnus_app
description: Magnus — Fal, Tarot ve Astroloji
publish_to: 'none'
version: 10.6.0+207

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Local storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Camera / image picker
  image_picker: ^1.1.2

  # HTTP client (Claude Vision API için)
  http: ^1.2.2

  # Fonts
  google_fonts: ^6.2.1

  # Video
  video_player: ^2.9.2

  # Audio (just_audio: ExoPlayer tabanlı, Android'de çok daha kaliteli)
  just_audio: ^0.9.46

  # Ads
  google_mobile_ads: ^5.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

# ── Uygulama ikonu ────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launcher_check.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/launcher_check.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# ── Giriş (splash) ekranı ─────────────────────────────────────────────────────
flutter_native_splash:
  color: "#000000"
  image: assets/images/magnusappicon_splash.png    # %80 küçültülmüş, kare
  color_dark: "#000000"
  image_dark: assets/images/magnusappicon_splash.png
  android_12:
    # Görsel 1024x1024 siyah canvas'a %62 oranında yerleştirilmiş
    # Köşe uzaklığı (458) < daire yarıçapı (512) → kesilmez
    image: assets/images/magnusappicon_a12.png
    color: "#000000"
    image_dark: assets/images/magnusappicon_a12.png
    color_dark: "#000000"
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/wheel/
    - assets/images/menu/
    - assets/images/tarot/
    - assets/images/tarot2/
    - assets/images/tarot3/
    - assets/images/tarot4/
    - assets/images/kahve/
    - assets/images/inbox_icons/
    - assets/images/astrotakvim/
    - assets/images/falbg/
    - assets/images/olumlama_bgs/
    - assets/images/ozlusoz_bgs/
    - assets/images/kahinler/
    - assets/images/kehanet/
    - assets/images/test/
    - assets/videos/
    - assets/videos/kahinler/
    - assets/sounds/kehanet/tamua/

  fonts:
    - family: ChixaDemiBold
      fonts:
        - asset: assets/fonts/ChixaDemiBold.ttf
    - family: AngillaTattoo
      fonts:
        - asset: assets/fonts/AngillaTattoo.ttf
    - family: SHPinscher
      fonts:
        - asset: assets/fonts/SHPinscher.otf
