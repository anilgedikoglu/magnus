workflows:

  # ── iOS App Store Release (Manuel Signing) ──────────────────────────────────
  ios-release:
    name: Magnus iOS — App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.29.2        # Lokal dev ile aynı versiyon — breaking change önleme
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing        # IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE
        - app_secrets        # ANTHROPIC_API_KEY
        - app_store_connect  # APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        BUNDLE_ID: com.futurastic.Magnus
        TEAM_ID: SN5Y726ZKF

    scripts:
      - name: Disable Swift Package Manager (google_mobile_ads uyumluluğu)
        script: flutter config --no-enable-swift-package-manager

      - name: Create app_secrets.dart (gitignored API key)
        script: |
          printf "const String kAnthropicApiKey = '%s';\n" "$ANTHROPIC_API_KEY" \
            > lib/core/constants/app_secrets.dart
          echo "app_secrets.dart oluşturuldu:"
          cat lib/core/constants/app_secrets.dart

      - name: Flutter pub get
        script: flutter pub get

      - name: Set up keychain
        script: keychain initialize

      - name: Import distribution certificate
        script: |
          echo "$IOS_CERTIFICATE" | base64 --decode > /tmp/ios_distribution.p12
          keychain add-certificates \
            --certificate /tmp/ios_distribution.p12 \
            --certificate-password "$IOS_CERTIFICATE_PASSWORD"

      - name: Install provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode \
            > "$PROFILES_HOME/Magnus_App_Store_Profile.mobileprovision"
          echo "Installed: Magnus_App_Store_Profile.mobileprovision"

      - name: Flutter build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        private_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
        submit_to_app_store: false # true yapınca Production'a gider — şimdilik TestFlight
