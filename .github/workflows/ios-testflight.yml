# iOS → TestFlight, GitHub Actions (Codemagic'in yedek yolu; macOS dakikası açık depoda ücretsiz).
# Yalnız elle tetiklenir: Actions → "iOS TestFlight" → Run workflow, ya da:
#   gh workflow run "iOS TestFlight" --repo anilgedikoglu/magnus --ref main
# Yalnız TestFlight'a YÜKLER — App Store incelemesine / beta incelemesine GÖNDERMEZ.
# Sürüm numarası pubspec.yaml'dan gelir (her build'de +3; aynı build no reddedilir).
#
# Secrets (repo → Settings → Secrets and variables → Actions) — değerler repoda YOK:
#   IOS_CERTIFICATE_P12_BASE64  dağıtım sertifikası .p12, base64 (ios_certs/IOS_CERTIFICATE.b64.txt)
#   IOS_CERTIFICATE_PASSWORD    .p12 şifresi
#   IOS_PROFILE_BASE64          "Magnus App Store Profile", base64 (ios_certs/IOS_PROVISIONING_PROFILE.b64.txt)
#   ASC_PRIVATE_KEY             App Store Connect API anahtarı .p8 içeriği (ios_certs/APP_STORE_CONNECT_PRIVATE_KEY.txt)
#   ANTHROPIC_API_KEY           AI falları (lib/core/constants/app_secrets.dart derlemede üretilir, gitignored)
name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  ASC_KEY_ID: G796KF2KD3
  ASC_ISSUER_ID: 8c4687a8-9df9-4d95-8516-3fa3b7576e44

jobs:
  ipa:
    name: Flutter → IPA → TestFlight
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 seç (App Store Connect eski SDK'yı reddeder)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true

      - name: Flutter ayarları + gizli anahtar dosyası
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          flutter --version
          flutter config --no-enable-swift-package-manager
          # İçeriği ASLA yazdırma (açık depo, loglar herkese açık).
          printf "const String kAnthropicApiKey = '%s';\n" "$ANTHROPIC_API_KEY" > lib/core/constants/app_secrets.dart
          [ -n "$ANTHROPIC_API_KEY" ] || echo "::warning::ANTHROPIC_API_KEY boş — AI falları çalışmaz"
          grep "^version:" pubspec.yaml
          flutter pub get

      - name: İmza (sertifika + profil)
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "Profil yüklendi: $UUID"
          security find-identity -v -p codesigning "$KC" | grep -c "Distribution" || true

      - name: IPA derle
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: TestFlight'a yükle (incelemeye göndermez)
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          ls -la "$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Temizlik
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" ~/.appstoreconnect/private_keys/*.p8 lib/core/constants/app_secrets.dart
