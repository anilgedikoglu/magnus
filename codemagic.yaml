workflows:

  # ── iOS App Store Release (Manuel Signing) ──────────────────────────────────
  ios-release:
    name: Magnus iOS — App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.futurastic.Magnus
        TEAM_ID: SN5Y726ZKF
        # IOS_CERTIFICATE            → Codemagic UI'da "File" türünde ekle (.p12 base64)
        # IOS_CERTIFICATE_PASSWORD   → Codemagic UI'da "Secure" string ekle
        # IOS_PROVISIONING_PROFILE   → Codemagic UI'da "File" türünde ekle (.mobileprovision base64)

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Set up keychain
        script: keychain initialize

      - name: Import distribution certificate
        script: |
          echo "$IOS_CERTIFICATE" | base64 --decode > /tmp/ios_distribution.p12
          keychain add-certificates \
            --certificate /tmp/ios_distribution.p12 \
            --certificate-password "$IOS_CERTIFICATE_PASSWORD"

      - name: Install provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode \
            > "$PROFILES_HOME/Magnus_App_Store_Profile.mobileprovision"
          echo "Installed: Magnus_App_Store_Profile.mobileprovision"

      - name: Flutter build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration          # Codemagic UI → Integrations → App Store Connect
        submit_to_testflight: true
        submit_to_app_store: false
