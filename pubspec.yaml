name: magnus_app
description: Magnus — Fal, Tarot ve Astroloji
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Local storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Camera / image picker
  image_picker: ^1.1.2

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/menu/
    - assets/images/tarot/

  fonts:
    - family: ChixaDemiBold
      fonts:
        - asset: assets/fonts/ChixaDemiBold.ttf
    - family: AngillaTattoo
      fonts:
        - asset: assets/fonts/AngillaTattoo.ttf
    - family: SHPinscher
      fonts:
        - asset: assets/fonts/SHPinscher.otf
