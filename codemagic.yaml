workflows:

  # ── iOS App Store Release ────────────────────────────────────────────────────
  ios-release:
    name: Magnus iOS — App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Magnus App Store Connect  # Codemagic panelinde bu isimle tanımla

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.magnus.magnusApp
      vars:
        BUNDLE_ID: com.magnus.magnusApp
        APP_STORE_APPLE_ID: "6738625684"   # App Store Connect > App > App Information > Apple ID
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Flutter build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # true yapınca doğrudan production'a gider

